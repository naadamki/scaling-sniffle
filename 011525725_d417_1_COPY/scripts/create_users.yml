---
- name: Section F - Automate Local User Account Creation
  hosts: access_closet_1
  gather_facts: false

  vars:
    new_username: "Local-Admin"
    new_password: "WGU123"
    account_type: "admin" # EXOS syntax for Read/Write privilege level

  tasks:
    - name: Ensure outputs directory exists
      ansible.builtin.file:
        path: "{{ playbook_dir }}/outputs"
        state: directory
        mode: '0755'
      delegate_to: localhost
      run_once: true

    - name: Create local administrator account on switch
      community.network.exos_config:
        lines:
          - "create account {{ account_type }} {{ new_username }} {{ new_password }}"
      register: user_create_result

    - name: Verify account creation
      community.network.exos_command:
        commands:
          - show accounts
      register: accounts_output

    - name: Save execution summary to outputs/section_f_user_creation.txt
      ansible.builtin.blockinfile:
        path: "{{ playbook_dir }}/outputs/section_f_user_creation.txt"
        create: true
        marker: "# {mark} ANSIBLE MANAGED BLOCK FOR {{ inventory_hostname }}"
        block: |
          ==================================================
          SWITCH: {{ inventory_hostname }} ({{ ansible_host | default(inventory_hostname) }})
          ==================================================
          Account Name: {{ new_username }}
          Access Level: Read/Write (EXOS Type: {{ account_type }})
          Changed: {{ user_create_result.changed }}

          --- SHOW ACCOUNTS VERIFICATION ---
          {{ accounts_output.stdout[0] }}
      delegate_to: localhost