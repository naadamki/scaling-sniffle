---
- name: Provision EXOS Users via SSH Expect Module
  hosts: Access_Closet_1
  gather_facts: false
  connection: local

  vars_files:
    - vault.yaml

  vars:
    new_username: "{{ vault_new_username }}"
    new_password: "{{ vault_new_password }}"
    access_level: "read-write"

  tasks:
    - name: Interactive SSH session to handle blank password and create user
      ansible.builtin.expect:
        command: "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PubkeyAcceptedAlgorithms=+ssh-rsa -o HostKeyAlgorithms=+ssh-rsa admin@{{ ansible_host }}"
        timeout: 30
        responses:
          (?i)password: ""
          
          (?i)[\#\>]:
            - "create account user {{ new_username }} {{ new_password }} {{ access_level }}"
            - "save configuration primary"
            - "y"
            - "exit"
      register: user_creation_result

    - name: Confirm execution success
      ansible.builtin.debug:
        msg: "Successfully provisioned user on {{ inventory_hostname }} ({{ ansible_host }})."
















