---
- name: Create Local-Admin Read/Write Account on EXOS Switches
  hosts: Access_Closet_1
  gather_facts: no
  
  tasks:
    - name: Provision Local-Admin account
      ansible.netcommon.cli_config:
        config:
          - "create account admin Local-Admin WGU123"
      register: account_result

    - name: Save configuration to primary (handling overwrite prompt)
      ansible.netcommon.cli_command:
        command: save configuration primary
        prompt:
          - "Do you want to save configuration to primary\\.cfg and overwrite it\\?"
        answer: 'y'