---
- name: Provision Read/Write Admin User on EXOS Switches
  hosts: Access_Closet_1
  gather_facts: no
  vars_files:
    - vault.yaml

  vars:
    new_username: " {{new_admin_user}} "
    new_password: " {{new_admin_password}} "
    access_level: "read-write"

  tasks:
      - name: Create EXOS user account with read/write access
        extremenetworks.exos.exos_config:
          lines:
            - "create account user {{ new_username }} {{ new_password }} {{ access_level }}"
        register: account_result
        failed_when:
          - account_result.failed | default(false)
          - "'already exists' not in (account_result.module_stderr | default('') | lower)"

      - name: Save configuration to primary
        extremenetworks.exos.exos_config:
          lines:
            - "save configuration primary"

      - name: Confirm deployment status
        ansible.builtin.debug:
          msg: "Account '{{ new_username }}' successfully configured on {{ inventory_hostname }} ({{ ansible_host }})."