---
- name: Force Provisioning via Raw SSH Pipeline
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Push user configuration to EXOS switches over raw SSH
      ansible.builtin.shell: |
        # Open an interactive SSH session, piping a blank newline for the password, followed by commands
        (
          echo -e "\n";
          sleep 1;
          echo "show accounts";
          sleep 1;
          echo "create account administrator Local_Admin WGU123";
          sleep 1;
          echo "save configuration primary";
          sleep 1;
          echo "exit";
        ) | ssh -tt -o StrictHostKeyChecking=no admin@{{ hostvars[item]['ansible_host'] }}
      loop: "{{ groups['Access_Closet_1'] }}"
      register: ssh_output
      ignore_errors: true

    - name: Display execution logs for confirmation
      ansible.builtin.debug:
        msg: "{{ item.stdout_lines }}"
      loop: "{{ ssh_output.results }}"
